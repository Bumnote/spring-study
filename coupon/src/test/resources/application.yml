spring:
  application:
    name: coupon

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false

  datasource:
    # 비즈니스 트랜잭션 전용 DataSource (JPA가 사용)
    business:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/coupon_db?useSSL=false&serverTimezone=UTC
      username: root
      password: 1234
      hikari:
        maximum-pool-size: 30
        pool-name: BusinessPool
    # Named Lock 전용 DataSource (LockRepository가 사용)
    lock:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/coupon_db?useSSL=false&serverTimezone=UTC
      username: root
      password: 1234
      hikari:
        maximum-pool-size: 200
        pool-name: LockPool
